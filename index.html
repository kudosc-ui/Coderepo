<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="color-scheme" content="dark light">
<title>CodeRepo Offline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M11 8v10a3 3 0 0 0 3 3h6M11 8a2 2 0 1 0 0 .01M21 21a2 2 0 1 0 0 .01' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script>
  // Apply saved theme before first paint to avoid a flash.
  try {
    var t = localStorage.getItem('cro-theme');
    if (t !== 'light' && t !== 'dark') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="topbar" id="topbar" role="banner"></header>

<main id="app" class="app" tabindex="-1" aria-live="polite">
  <div class="boot"><div class="spinner"></div><p>Opening local database…</p></div>
</main>

<nav class="bottomnav" id="bottomnav" aria-label="Primary"></nav>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="overlay-root"></div>

<noscript><p style="padding:24px;font-family:sans-serif">CodeRepo Offline needs JavaScript enabled.</p></noscript>
<script src="script.js"></script>
</body>
</html>
